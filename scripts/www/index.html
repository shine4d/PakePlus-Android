    if (isActive) {
      idxEl.innerHTML = playing
        ? `<svg class="stroke" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>`
        : `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    } else {
      idxEl.textContent = (Number(row.dataset.pos) + 1);
    }
  });
}
function updateNowPlaying(){
  const t = state.tracks[state.currentIndex];
  const coverEl = $('#npCover');
  if (!t) {
    $('#npTitle').textContent = '未在播放';
    $('#npArtist').textContent = '—';
    coverEl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>`;
    coverEl.classList.remove('playing');
    $('#seek').disabled = true;
    $('#timeCur').textContent = '0:00';
    $('#timeDur').textContent = '0:00';
    setRange($('#seek'), 0);
    // 清空装饰里的封面
    const vc = $('#vinylCover'); if (vc) vc.innerHTML = '';
    const cc = $('#cassetteCover'); if (cc) cc.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
    const cdc = $('#cdCover'); if (cdc) cdc.innerHTML = '';
    return;
  }
  $('#npTitle').textContent = t.title;
  $('#npArtist').textContent = t.artist;
  const coverHTML = t.artwork
    ? `<img src="${t.artwork}" alt="">`
    : `<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>`;
  coverEl.innerHTML = coverHTML;
  coverEl.classList.toggle('playing', state.playing);

  // 同步到装饰层的封面
  const vc = $('#vinylCover'); if (vc) vc.innerHTML = coverHTML;
  const cc = $('#cassetteCover'); if (cc) cc.innerHTML = coverHTML;
  const cdc = $('#cdCover'); if (cdc) cdc.innerHTML = coverHTML;

  $('#seek').disabled = false;
}

/* ============================================================
   播放控制
   ============================================================ */
function playIndex(index, autoplay = true){
  if (index < 0 || index >= state.tracks.length) return;
  const track = state.tracks[index];
  try { audio.pause(); } catch (_) {}
  state.currentIndex = index;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  try { audio.src = track.url; }
  catch (e) { console.warn('设置音频源失败：', track.name, e); return; }
  if (autoplay) {
    const p = audio.play();
    if (p && p.then) {
      p.then(() => { state.playing = true; updatePlayButton(); })
       .catch(err => {
         console.warn('播放失败：', track.name, err);
         state.playing = false;
         updatePlayButton();
       });
    }
  }
  updateNowPlaying();
  updatePlayButton();
  renderList();
}
function togglePlay(){
  if (state.currentIndex < 0) {
    if (state.tracks.length) playIndex(0);
    return;
  }
  if (audio.paused) {
    ensureAudioCtx();
    const p = audio.play();
    if (p && p.catch) {
      p.then(() => { state.playing = true; updatePlayButton(); })
       .catch(() => { state.playing = false; updatePlayButton(); });
    }
  } else {
    audio.pause();
    state.playing = false;
    updatePlayButton();
  }
}
function nextTrack(auto = false){
  if (!state.tracks.length) return;
  if (state.currentIndex < 0) { playIndex(0); return; }
  if (state.tracks.length === 1) {
    if (state.repeat === 'off' && auto) { state.playing = false; updatePlayButton(); return; }
    try { audio.currentTime = 0; } catch (_) {}
    const p = audio.play(); if (p && p.catch) p.catch(() => {});
    return;
  }
  if (state.shuffle) {
    let n;
    do { n = Math.floor(Math.random() * state.tracks.length); } while (n === state.currentIndex);
    playIndex(n); return;
  }
  let n = state.currentIndex + 1;
  if (n >= state.tracks.length) {
    if (auto && state.repeat === 'off') { state.playing = false; updatePlayButton(); return; }
    n = 0;
  }
  playIndex(n);
}
function prevTrack(){
  if (!state.tracks.length) return;
  if (state.currentIndex >= 0 && audio.currentTime > 3) {
    try { audio.currentTime = 0; } catch (_) {}
    return;
  }
  if (state.currentIndex < 0) { playIndex(0); return; }
  if (state.tracks.length === 1) {
    try { audio.currentTime = 0; } catch (_) {}
    const p = audio.play(); if (p && p.catch) p.catch(() => {});
    return;
  }
  if (state.shuffle) {
    let n;
    do { n = Math.floor(Math.random() * state.tracks.length); } while (n === state.currentIndex);
    playIndex(n); return;
  }
  let n = state.currentIndex - 1;
  if (n < 0) n = state.tracks.length - 1;
  playIndex(n);
}
function seekBy(delta){
  if (state.currentIndex < 0) return;
  const dur = audio.duration || 0;
  if (!dur) return;
  audio.currentTime = Math.max(0, Math.min(dur, audio.currentTime + delta));
}
function cycleRepeat(){
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  updateRepeatButton();
  saveState();
}
function updateRepeatButton(){
  const btn = $('#btnRepeat');
  const icon = $('#repeatIcon');
  const path = `M17 2l4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3`;
  if (state.repeat === 'one') {
    icon.innerHTML = `<path d="${path}"/><text x="12" y="15" font-size="7" font-weight="700" fill="currentColor" text-anchor="middle" stroke="none">1</text>`;
    btn.classList.add('on');
    btn.title = '单曲循环（R）';
  } else if (state.repeat === 'all') {
    icon.innerHTML = `<path d="${path}"/>`;
    btn.classList.add('on');
    btn.title = '列表循环（R）';
  } else {
    icon.innerHTML = `<path d="${path}"/>`;
    btn.classList.remove('on');
    btn.title = '顺序播放（R）';
  }
}
function updateVolumeIcon(){
  const v = state.volume;
  const base = $('#volBase');
  const w1 = $('#volW1'), w2 = $('#volW2');
  if (v <= 0.01) {
    base.setAttribute('d', 'M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6');
    w1.style.display = 'none'; w2.style.display = 'none';
  } else {
    base.setAttribute('d', 'M11 5 6 9H2v6h4l5 4z');
    w1.style.display = v > 0.05 ? '' : 'none';
    w2.style.display = v > 0.5 ? '' : 'none';
  }
}

/* ============================================================
   音频事件
   ============================================================ */
audio.addEventListener('play', () => { state.playing = true; updatePlayButton(); ensureAudioCtx(); });
audio.addEventListener('pause', () => { if (audio.ended) return; state.playing = false; updatePlayButton(); });
audio.addEventListener('timeupdate', () => {
  if (state.seeking) return;
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 0;
  $('#timeCur').textContent = fmt(cur);
  $('#timeDur').textContent = fmt(dur);
  const pct = dur > 0 ? (cur / dur) * 100 : 0;
  const seek = $('#seek');
  seek.value = pct;
  setRange(seek, pct);
  // 磁带 LED 时间同步
  const led = $('#ledTime');
  if (led) led.textContent = fmt(cur).padStart(5, '0');
  const t = state.tracks[state.currentIndex];
  if (t && t.duration === 0 && dur > 0) {
    t.duration = dur;
    const row = document.querySelector(`.row[data-index="${state.currentIndex}"] .row-dur`);
    if (row) row.textContent = fmt(dur);
    DB.putTrack(dehydrateTrack(t)).catch(() => {});
  }
});
audio.addEventListener('loadedmetadata', () => { $('#timeDur').textContent = fmt(audio.duration || 0); });
audio.addEventListener('ended', () => {
  if (state.repeat === 'one') {
    try { audio.currentTime = 0; const p = audio.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
    return;
  }
  nextTrack(true);
});
audio.addEventListener('error', () => {
  if (!audio.src) return;
  const err = audio.error;
  if (err && err.code === err.MEDIA_ERR_ABORTED) return;
  const t = state.tracks[state.currentIndex];
  if (t) console.warn('无法播放：', t.name, err ? `(code ${err.code})` : '');
  state.playing = false;
  updatePlayButton();
});

/* ============================================================
   UI 事件绑定
   ============================================================ */
$('#fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('#folderInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('#btnAddFiles').addEventListener('click', () => $('#fileInput').click());
$('#btnAddFolder').addEventListener('click', () => $('#folderInput').click());
$('#btnClear').addEventListener('click', clearAll);

const searchInput = $('#searchInput');
const searchClear = $('#searchClear');
searchInput.addEventListener('input', e => {
  state.search = e.target.value;
  searchClear.classList.toggle('show', state.search.length > 0);
  renderList();
});
searchClear.addEventListener('click', () => {
  searchInput.value = ''; state.search = '';
  searchClear.classList.remove('show');
  renderList();
  searchInput.focus();
});
$('#sortSelect').addEventListener('change', e => { state.sortBy = e.target.value; renderList(); });

$('#btnBgFx').addEventListener('click', e => {
  e.stopPropagation();   // 阻止事件冒泡，防止被外面监听吃掉
  applyBgFxEnabled(!bgfxEnabled);
  toast(bgfxEnabled ? '极光背景：已开启' : '极光背景：已关闭');
});


const playModePop = $('#playModePop');
const btnPlayMode = $('#btnPlayMode');
btnPlayMode.addEventListener('click', e => {
  e.stopPropagation();
  palettePop.classList.remove('show');
  playModePop.classList.toggle('show');
});
const palettePop = $('#palettePop');
const btnPalette = $('#btnPalette');
btnPalette.addEventListener('click', e => {
  e.stopPropagation();
  playModePop.classList.remove('show');
  palettePop.classList.toggle('show');
});
// ★ 触屏/鼠标兼容：点击外部关闭弹窗
function handleOutsideClick(e){
  if (!palettePop.contains(e.target) && !btnPalette.contains(e.target)) palettePop.classList.remove('show');
  if (!playModePop.contains(e.target) && !btnPlayMode.contains(e.target)) playModePop.classList.remove('show');
}
document.addEventListener('pointerdown', handleOutsideClick);
const listEl = $('#list');
let dragFrom = -1;
listEl.addEventListener('click', e => {
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) { e.stopPropagation(); removeTrack(Number(delBtn.dataset.del)); return; }
  const row = e.target.closest('.row');
  if (!row) return;
  const idx = Number(row.dataset.index);
  if (idx === state.currentIndex) togglePlay();
  else playIndex(idx);
});
listEl.addEventListener('dragstart', e => {
  const row = e.target.closest('.row');
  if (!row || !row.draggable) { e.preventDefault(); return; }
  dragFrom = Number(row.dataset.index);
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(dragFrom)); } catch (_) {}
});
listEl.addEventListener('dragover', e => {
  if (dragFrom < 0) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const row = e.target.closest('.row');
  document.querySelectorAll('.row.drop-before, .row.drop-after').forEach(r => r.classList.remove('drop-before','drop-after'));
  if (!row) return;
  const rect = row.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  row.classList.add(before ? 'drop-before' : 'drop-after');
});
listEl.addEventListener('dragleave', e => {
  if (!listEl.contains(e.relatedTarget)) {
    document.querySelectorAll('.row.drop-before, .row.drop-after').forEach(r => r.classList.remove('drop-before','drop-after'));
  }
});
listEl.addEventListener('drop', e => {
  if (dragFrom < 0) return;
  e.preventDefault();
  const row = e.target.closest('.row');
  document.querySelectorAll('.row.drop-before, .row.drop-after').forEach(r => r.classList.remove('drop-before','drop-after'));
  if (row) {
    const to = Number(row.dataset.index);
    const rect = row.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height / 2;
    let target = before ? to : to + 1;
    if (dragFrom < target) target--;
    if (target !== dragFrom) reorder(dragFrom, target);
  }
  dragFrom = -1;
});
listEl.addEventListener('dragend', () => {
  dragFrom = -1;
  document.querySelectorAll('.row').forEach(r => r.classList.remove('dragging','drop-before','drop-after'));
});

$('#btnPlay').addEventListener('click', togglePlay);
$('#btnNext').addEventListener('click', () => nextTrack(false));
$('#btnPrev').addEventListener('click', prevTrack);
$('#btnShuffle').addEventListener('click', () => {
  state.shuffle = !state.shuffle;
  $('#btnShuffle').classList.toggle('on', state.shuffle);
  saveState();
});
$('#btnRepeat').addEventListener('click', cycleRepeat);

const seekEl = $('#seek');
seekEl.addEventListener('input', () => {
  state.seeking = true;
  const pct = Number(seekEl.value);
  const dur = audio.duration || 0;
  $('#timeCur').textContent = fmt(dur * pct / 100);
  setRange(seekEl, pct);
});
seekEl.addEventListener('change', () => {
  const pct = Number(seekEl.value);
  const dur = audio.duration || 0;
  if (dur > 0) audio.currentTime = dur * pct / 100;
  state.seeking = false;
  saveState();
});

const volEl = $('#volume');
volEl.value = Math.round(state.volume * 100);
setRange(volEl, state.volume * 100);
volEl.addEventListener('input', () => {
  const v = Number(volEl.value) / 100;
  state.volume = v; audio.volume = v;
  setRange(volEl, v * 100);
  updateVolumeIcon();
});
volEl.addEventListener('change', () => saveState());
let lastVolume = state.volume;
$('#volBtn').addEventListener('click', () => {
  if (state.volume > 0.01) { lastVolume = state.volume; state.volume = 0; }
  else { state.volume = lastVolume || 0.7; }
  audio.volume = state.volume;
  volEl.value = Math.round(state.volume * 100);
  setRange(volEl, state.volume * 100);
  updateVolumeIcon();
  saveState();
});

const themeBtn = $('#btnTheme');
const themeIcon = $('#themeIcon');
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  themeIcon.innerHTML = theme === 'dark'
    ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`
    : `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  DB.saveSetting('theme', next).catch(() => {});
});

const helpOverlay = $('#helpOverlay');
$('#btnHelp').addEventListener('click', () => helpOverlay.classList.add('show'));
$('#helpClose').addEventListener('click', () => helpOverlay.classList.remove('show'));
helpOverlay.addEventListener('click', e => { if (e.target === helpOverlay) helpOverlay.classList.remove('show'); });

/* ============================================================
   拖拽文件 / 文件夹
   ============================================================ */
const dropOverlay = $('#dropOverlay');
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) dropOverlay.classList.add('show');
});
window.addEventListener('dragover', e => {
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth--;
  if (dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('show'); }
});
window.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  dropOverlay.classList.remove('show');
  const dt = e.dataTransfer;
  if (!dt) return;
  if (dragFrom >= 0) return;
  const files = [];
  if (dt.items && dt.items.length && dt.items[0].webkitGetAsEntry) {
    const entries = [];
    for (let i = 0; i < dt.items.length; i++) {
      const entry = dt.items[i].webkitGetAsEntry();
      if (entry) entries.push(entry);
    }
    await Promise.all(entries.map(en => traverseEntry(en, files)));
  } else if (dt.files) {
    files.push(...Array.from(dt.files));
  }
  if (files.length) addFiles(files);
});
function traverseEntry(entry, out){
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(file => {
        if (isAudio(file.name)) out.push(file);
        resolve();
      }, () => resolve());
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const readBatch = () => {
        reader.readEntries(async entries => {
          if (!entries.length) { resolve(); return; }
          await Promise.all(entries.map(en => traverseEntry(en, out)));
          readBatch();
        }, () => resolve());
      };
      readBatch();
    } else resolve();
  });
}

/* ============================================================
   键盘快捷键
   ============================================================ */
window.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const inInput = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.key === 'Escape') {
    if (helpOverlay.classList.contains('show')) { helpOverlay.classList.remove('show'); return; }
    if (palettePop.classList.contains('show')) { palettePop.classList.remove('show'); return; }
    if (playModePop.classList.contains('show')) { playModePop.classList.remove('show'); return; }
    if (inInput) { document.activeElement.blur(); return; }
    return;
  }
  if (e.key === '?' && !inInput) {
    e.preventDefault();
    helpOverlay.classList.toggle('show');
    return;
  }
  if (inInput) return;
  const meta = e.metaKey || e.ctrlKey;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': e.preventDefault(); if (meta) nextTrack(false); else seekBy(5); break;
    case 'ArrowLeft': e.preventDefault(); if (meta) prevTrack(); else seekBy(-5); break;
    case 'ArrowUp':
      e.preventDefault();
      state.volume = Math.min(1, state.volume + 0.05);
      audio.volume = state.volume;
      volEl.value = Math.round(state.volume * 100);
      setRange(volEl, state.volume * 100);
      updateVolumeIcon(); saveState();
      break;
    case 'ArrowDown':
      e.preventDefault();
      state.volume = Math.max(0, state.volume - 0.05);
      audio.volume = state.volume;
      volEl.value = Math.round(state.volume * 100);
      setRange(volEl, state.volume * 100);
      updateVolumeIcon(); saveState();
      break;
    case 'm': case 'M': $('#volBtn').click(); break;
    case 's': case 'S': $('#btnShuffle').click(); break;
    case 'r': case 'R': cycleRepeat(); break;
    case 'b': case 'B':
      e.preventDefault();
      applyBgFxEnabled(!bgfxEnabled);
      toast(bgfxEnabled ? '极光背景：已开启' : '极光背景：已关闭');
      break;
    case 'p': case 'P':
      e.preventDefault();
      palettePop.classList.remove('show');
      playModePop.classList.toggle('show');
      break;
    case 'c': case 'C':
      e.preventDefault();
      playModePop.classList.remove('show');
      palettePop.classList.toggle('show');
      break;
    case 'f': case 'F': e.preventDefault(); searchInput.focus(); searchInput.select(); break;
  }
});

/* ============================================================
   保存
   ============================================================ */
window.addEventListener('beforeunload', () => {
  try {
    DB.saveSetting('volume', state.volume);
    DB.saveSetting('repeat', state.repeat);
    DB.saveSetting('shuffle', state.shuffle);
    DB.saveSetting('theme', document.documentElement.getAttribute('data-theme') || 'dark');
    DB.saveSetting('colorTheme', currentColorTheme);
    DB.saveSetting('bgfxEnabled', bgfxEnabled);
    DB.saveSetting('playMode', currentPlayMode);
    if (state.currentIndex >= 0 && state.tracks[state.currentIndex]) {
      DB.saveSetting('currentId', state.tracks[state.currentIndex].id);
      DB.saveSetting('currentTime', audio.currentTime || 0);
    }
  } catch (e) {}
});
setInterval(() => {
  if (state.currentIndex >= 0 && !audio.paused) saveState();
}, 5000);

/* ============================================================
   初始化
   ============================================================ */
(async function init(){
  let theme = 'dark';
  try {
    const t = localStorage.getItem('music-theme');
    if (t === 'light' || t === 'dark') theme = t;
  } catch (_) {}
  applyTheme(theme);

  let colorKey = 'blue';
  try {
    const c = localStorage.getItem('music-color-theme');
    if (c) colorKey = c;
  } catch (_) {}
  applyColorTheme(colorKey, false);

  let bgfxSaved = '1';
  try {
    const b = localStorage.getItem('music-bgfx');
    if (b === '0' || b === '1') bgfxSaved = b;
  } catch (_) {}
  applyBgFxEnabled(bgfxSaved === '1', false);

  let playModeSaved = 'default';
  try {
    const p = localStorage.getItem('music-playmode');
    if (p) playModeSaved = p;
  } catch (_) {}
  applyPlayMode(playModeSaved, false);

  buildPaletteUI();
  buildPlayModeUI();
  initBgFx();
  initVizCanvas();

  updatePlayButton();
  updateRepeatButton();
  updateVolumeIcon();
  updateNowPlaying();
  renderList();
  updateCount();

  await restoreLibrary();

  try {
    const t = await DB.getSetting('theme');
    if (t === 'light' || t === 'dark') applyTheme(t);
    const c = await DB.getSetting('colorTheme');
    if (c) applyColorTheme(c, false);
    const b = await DB.getSetting('bgfxEnabled');
    if (typeof b === 'boolean') applyBgFxEnabled(b, false);
    const p = await DB.getSetting('playMode');
    if (p) applyPlayMode(p, false);
  } catch (e) {}

  const est = await estimateStorage();
  if (est) {
    const mb = v => (v / 1024 / 1024).toFixed(1);
    console.log(`拾音匣 · 本地存储：已用 ${mb(est.usage || 0)} MB / 配额 ${mb(est.quota || 0)} MB`);
  }
})();
</script>
