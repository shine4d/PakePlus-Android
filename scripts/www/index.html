            const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 8;
            state.particles.push({
                x: p.x + p.width/2, y: p.y + p.height/2,
                vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3,
                size: 3 + Math.random() * 8,
                color: `hsl(${Math.random() * 360}, 100%, 70%)`,
                life: 60 + Math.random() * 40, maxLife: 100,
            });
        }
        updateBuffDisplay();
    }
    function updateBuffDisplay() {
        const atk = state.buffs.attackBonus, spd = state.buffs.speedBonus;
        if (atk === 0 && spd === 0) { buffListEl.innerHTML = ''; return; }
        buffListEl.innerHTML = `<span>⚔️ +${atk}</span><span>💨 +${spd.toFixed(1)}</span>`;
    }

    // ============================================================
    // 攻击
    // ============================================================
    function playerAttack(attacker, target) {
        if (attacker.attackCooldown > 0 || attacker.attackTimer > 0) return false;
        if (attacker.blocking) return false;
        attacker.attackTimer = 10;
        attacker.attackCooldown = 15;
        const range = 95;
        const ax = attacker.x + (attacker.facing * 35);
        const ay = attacker.y - 15;
        const dx = (target.x + target.width/2) - (attacker.x + attacker.width/2);
        const dy = (target.y + target.height/2) - (attacker.y + attacker.height/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        const facingTarget = (attacker.facing > 0 && dx > 0) || (attacker.facing < 0 && dx < 0);
        attackSpark(ax, ay - 10, attacker.facing);
        AudioSys.swing();
        if (dist < range && facingTarget) {
            let dmg = attacker.attackPower + Math.floor(attacker.combo / 3);
            if (target.blocking && target.blockEnergy > 0) {
                dmg = Math.floor(dmg * 0.2);
                target.blockEnergy -= 15;
                if (target.blockEnergy < 0) target.blockEnergy = 0;
                spawnEffect(target.x + target.width/2, target.y - 20, '🛡️ 格挡', '#88ccff', 22, 30);
                AudioSys.blockHit(); Vibration.light();
            } else { AudioSys.hit(); Vibration.medium(); }
            target.health = Math.max(0, target.health - dmg);
            if (target.hurtFlash !== undefined) target.hurtFlash = 8;
            target.x += attacker.facing * 28;
            spawnParticles(target.x + target.width/2, target.y + target.height/2, 18, '#ff5555', 7, 8, 45);
            spawnFloatingText(target.x + target.width/2, target.y - 10, `-${dmg}`, '#ff8888', 22);
            addCombo(attacker);
            attacker.energy = Math.min(attacker.maxEnergy, attacker.energy + 8);
        } else {
            spawnEffect(ax, ay - 20, '💨', '#cccccc', 22, 28);
            AudioSys.miss();
            resetCombo(attacker);
        }
        return true;
    }
    function playerSpecial(attacker, target) {
        if (attacker.energy < 30) {
            spawnEffect(attacker.x + attacker.width/2, attacker.y - 50, '⚡能量不足', '#ffaa00', 20, 30);
            AudioSys.noEnergy(); return false;
        }
        if (attacker.specialTimer > 0) return false;
        attacker.energy -= 30;
        attacker.specialTimer = 16;
        attacker.invincible = 20;
        const cx = attacker.x + attacker.width/2 + attacker.facing * 50;
        const cy = attacker.y - 10;
        specialBurst(cx, cy, attacker.facing);
        AudioSys.special();
        Vibration.heavy();
        const dx = (target.x + target.width/2) - (attacker.x + attacker.width/2);
        const dy = (target.y + target.height/2) - (attacker.y + attacker.height/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 160) {
            let dmg = attacker.specialPower + Math.floor(attacker.combo / 2);
            if (target.blocking && target.blockEnergy > 0) {
                dmg = Math.floor(dmg * 0.3);
                target.blockEnergy -= 25;
                if (target.blockEnergy < 0) target.blockEnergy = 0;
                spawnEffect(target.x + target.width/2, target.y - 20, '🛡️ 格挡', '#88ccff', 24, 30);
                AudioSys.blockHit();
            } else { AudioSys.specialHit(); }
            target.health = Math.max(0, target.health - dmg);
            if (target.hurtFlash !== undefined) target.hurtFlash = 12;
            target.x += attacker.facing * 45;
            spawnParticles(target.x + target.width/2, target.y + target.height/2, 30, '#aa88ff', 10, 12, 60);
            spawnFloatingText(target.x + target.width/2, target.y - 30, `-${dmg}`, '#c88aff', 28);
            addCombo(attacker, 2);
        } else {
            spawnEffect(cx, cy, '✨ 能量爆发', '#88ddff', 28, 40);
        }
        return true;
    }
    function playerDash(attacker) {
        if (attacker.dashCooldown > 0 || attacker.dashTimer > 0) return false;
        if (attacker.energy < 20) {
            spawnEffect(attacker.x + attacker.width/2, attacker.y - 50, '⚡能量不足', '#ffaa00', 18, 25);
            AudioSys.noEnergy(); return false;
        }
        attacker.energy -= 20;
        attacker.dashCooldown = 60;
        attacker.dashTimer = 12;
        attacker.dashVX = attacker.facing * 18;
        attacker.invincible = 14;
        AudioSys.dash();
        Vibration.light();
        for (let i = 0; i < 20; i++) {
            state.particles.push({
                x: attacker.x + attacker.width/2,
                y: attacker.y + Math.random() * attacker.height,
                vx: -attacker.facing * (2 + Math.random() * 4),
                vy: (Math.random() - 0.5) * 2,
                size: 3 + Math.random() * 6,
                color: SKINS[selectedSkin].accent,
                life: 20 + Math.random() * 15, maxLife: 35,
            });
        }
        return true;
    }

    // ============================================================
    // 敌人 AI
    // ============================================================
    function updateEnemy() {
        const e = state.enemy;
        const p = state.player;
        if (state.gameOver || state.stageTransition > 0) return;
        const dx = (p.x + p.width/2) - (e.x + e.width/2);
        const dy = (p.y + p.height/2) - (e.y + e.height/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        e.facing = dx > 0 ? 1 : -1;
        if (e.type === 'melee') {
            if (dist > 110) { if (dx > 0) e.x += e.speed; else e.x -= e.speed; }
            else if (dist < 70) { if (dx > 0) e.x -= e.speed * 0.6; else e.x += e.speed * 0.6; }
            if (dist < 100 && e.attackCooldown <= 0) {
                e.attackTimer = 12; e.attackCooldown = 50;
                if (p.invincible <= 0) {
                    let dmg = e.attackPower;
                    if (p.blocking && p.blockEnergy > 0) {
                        dmg = Math.floor(dmg * 0.2);
                        p.blockEnergy -= 15; if (p.blockEnergy < 0) p.blockEnergy = 0;
                        spawnEffect(p.x + p.width/2, p.y - 20, '🛡️ 格挡', '#88ccff', 22, 30);
                        AudioSys.blockHit(); Vibration.light();
                    } else { AudioSys.hurt(); Vibration.medium(); resetCombo(p); }
                    p.health = Math.max(0, p.health - dmg);
                    p.invincible = 15;
                    p.x += e.facing * 20;
                    spawnParticles(p.x + p.width/2, p.y + p.height/2, 12, '#ff4444', 6, 7, 40);
                    spawnFloatingText(p.x + p.width/2, p.y - 20, `-${dmg}`, '#ff6666', 20);
                }
            }
        } else if (e.type === 'ranged') {
            if (dist < 200) { if (dx > 0) e.x -= e.speed; else e.x += e.speed; }
            else if (dist > 300) { if (dx > 0) e.x += e.speed; else e.x -= e.speed; }
            if (e.shootCooldown > 0) e.shootCooldown--;
            if (e.shootCooldown <= 0 && !state.gameOver) {
                e.shootCooldown = 70;
                const angle = Math.atan2(dy, dx);
                state.projectiles.push({
                    x: e.x + e.width/2, y: e.y + e.height/2,
                    vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7,
                    radius: 8, damage: e.attackPower, color: '#ff8844', owner: 'enemy',
                });
                AudioSys.enemyShoot();
            }
        } else if (e.type === 'flying') {
            e.floatPhase += 0.05;
            e.y = 280 + Math.sin(e.floatPhase) * 40;
            if (dist > 130) { if (dx > 0) e.x += e.speed; else e.x -= e.speed; }
            else if (dist < 80) { if (dx > 0) e.x -= e.speed * 0.5; else e.x += e.speed * 0.5; }
            if (dist < 120 && e.attackCooldown <= 0) {
                e.attackTimer = 12; e.attackCooldown = 60;
                if (p.invincible <= 0) {
                    let dmg = e.attackPower;
                    if (p.blocking && p.blockEnergy > 0) {
                        dmg = Math.floor(dmg * 0.2);
                        p.blockEnergy -= 15; if (p.blockEnergy < 0) p.blockEnergy = 0;
                        spawnEffect(p.x + p.width/2, p.y - 20, '🛡️ 格挡', '#88ccff', 22, 30);
                        AudioSys.blockHit();
                    } else { AudioSys.hurt(); Vibration.medium(); resetCombo(p); }
                    p.health = Math.max(0, p.health - dmg);
                    p.invincible = 15;
                    spawnParticles(p.x + p.width/2, p.y + p.height/2, 10, '#cc88ff', 5, 7, 40);
                    spawnFloatingText(p.x + p.width/2, p.y - 20, `-${dmg}`, '#cc88ff', 20);
                }
            }
        } else if (e.type === 'summoner') {
            if (dist < 180) { if (dx > 0) e.x -= e.speed * 0.7; else e.x += e.speed * 0.7; }
            else if (dist > 320) { if (dx > 0) e.x += e.speed; else e.x -= e.speed; }
            if (e.shootCooldown > 0) e.shootCooldown--;
            if (e.shootCooldown <= 0) {
                e.shootCooldown = 90;
                for (let k = -1; k <= 1; k++) {
                    const angle = Math.atan2(dy, dx) + k * 0.3;
                    state.projectiles.push({
                        x: e.x + e.width/2, y: e.y + e.height/2,
                        vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6,
                        radius: 10, damage: e.attackPower, color: '#ff44aa', owner: 'enemy',
                    });
                }
                AudioSys.enemyShoot();
            }
            if (e.summonCooldown > 0) e.summonCooldown--;
            if (e.summonCooldown <= 0 && state.minions.length < 3) {
                e.summonCooldown = 240;
                for (let i = 0; i < 2; i++) {
                    state.minions.push({
                        x: e.x + (Math.random() - 0.5) * 100,
                        y: 350 + (Math.random() - 0.5) * 50,
                        width: 32, height: 44,
                        health: 40, maxHealth: 40,
                        speed: 2.5, attackPower: Math.floor(e.attackPower * 0.5),
                        facing: -1, attackTimer: 0, attackCooldown: 60, hurtFlash: 0,
                    });
                }
                AudioSys.summon();
                spawnEffect(e.x + e.width/2, e.y - 40, '🌀 召唤!', '#ff44aa', 30, 50);
            }
        }
        e.x = Math.max(50, Math.min(logicalWidth - e.width - 50, e.x));
        if (e.attackCooldown > 0) e.attackCooldown--;
        if (e.attackTimer > 0) e.attackTimer--;
        if (e.hurtFlash > 0) e.hurtFlash--;
    }
    function updateMinions() {
        const p = state.player;
        for (let i = state.minions.length - 1; i >= 0; i--) {
            const m = state.minions[i];
            if (m.health <= 0) {
                spawnParticles(m.x + m.width/2, m.y + m.height/2, 15, '#ff44aa', 6, 7, 40);
                state.minions.splice(i, 1); continue;
            }
            const dx = (p.x + p.width/2) - (m.x + m.width/2);
            const dist = Math.abs(dx);
            m.facing = dx > 0 ? 1 : -1;
            if (dist > 50) { if (dx > 0) m.x += m.speed; else m.x -= m.speed; }
            m.x = Math.max(30, Math.min(logicalWidth - m.width - 30, m.x));
            if (m.attackCooldown > 0) m.attackCooldown--;
            if (m.attackTimer > 0) m.attackTimer--;
            if (dist < 70 && m.attackCooldown <= 0 && p.invincible <= 0) {
                m.attackTimer = 10; m.attackCooldown = 70;
                let dmg = m.attackPower;
                if (p.blocking && p.blockEnergy > 0) {
                    dmg = Math.floor(dmg * 0.2);
                    p.blockEnergy -= 10; if (p.blockEnergy < 0) p.blockEnergy = 0;
                    spawnEffect(p.x + p.width/2, p.y - 20, '🛡️', '#88ccff', 18, 25);
                    AudioSys.blockHit();
                } else { AudioSys.hurt(); Vibration.light(); resetCombo(p); }
                p.health = Math.max(0, p.health - dmg);
                p.invincible = 10;
                spawnFloatingText(p.x + p.width/2, p.y - 20, `-${dmg}`, '#ff6666', 18);
            }
            if (m.hurtFlash > 0) m.hurtFlash--;
        }
    }
    function updateProjectiles() {
        const p = state.player;
        for (let i = state.projectiles.length - 1; i >= 0; i--) {
            const pr = state.projectiles[i];
            pr.x += pr.vx; pr.y += pr.vy;
            if (pr.x < -50 || pr.x > logicalWidth + 50 || pr.y < -50 || pr.y > logicalHeight + 50) {
                state.projectiles.splice(i, 1); continue;
            }
            if (pr.owner === 'enemy') {
                const dx = (p.x + p.width/2) - pr.x;
                const dy = (p.y + p.height/2) - pr.y;
                if (Math.sqrt(dx*dx + dy*dy) < pr.radius + 25 && p.invincible <= 0) {
                    let dmg = pr.damage;
                    if (p.blocking && p.blockEnergy > 0) {
                        dmg = Math.floor(dmg * 0.2);
                        p.blockEnergy -= 15; if (p.blockEnergy < 0) p.blockEnergy = 0;
                        spawnEffect(p.x + p.width/2, p.y - 20, '🛡️ 格挡', '#88ccff', 22, 30);
                        AudioSys.blockHit();
                    } else { AudioSys.hurt(); Vibration.medium(); resetCombo(p); }
                    p.health = Math.max(0, p.health - dmg);
                    p.invincible = 15;
                    spawnParticles(pr.x, pr.y, 12, pr.color, 5, 7, 35);
                    spawnFloatingText(p.x + p.width/2, p.y - 20, `-${dmg}`, '#ff6666', 18);
                    state.projectiles.splice(i, 1);
                }
            }
        }
    }
    function updatePlayerState(target) {
        if (target.attackCooldown > 0) target.attackCooldown--;
        if (target.attackTimer > 0) target.attackTimer--;
        if (target.specialTimer > 0) target.specialTimer--;
        if (target.invincible > 0) target.invincible--;
        if (target.dashCooldown > 0) target.dashCooldown--;
        if (target.hurtFlash > 0) target.hurtFlash--;
        if (target.comboTimer > 0) {
            target.comboTimer--;
            if (target.comboTimer <= 0) resetCombo(target);
        }
        if (target.dashTimer > 0) {
            target.dashTimer--;
            target.x += target.dashVX;
            target.dashVX *= 0.85;
            if (Math.random() < 0.7) {
                state.particles.push({
                    x: target.x + target.width/2 + (Math.random() - 0.5) * target.width,
                    y: target.y + target.height/2 + (Math.random() - 0.5) * target.height,
                    vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                    size: 4 + Math.random() * 6,
                    color: SKINS[selectedSkin].accent,
                    life: 15 + Math.random() * 10, maxLife: 25,
                });
            }
        }
        if (target.blocking && target.blockEnergy > 0) {
            target.blockEnergy -= 0.3;
            if (target.blockEnergy < 0) target.blockEnergy = 0;
            if (target.blockEnergy <= 0) target.blocking = false;
        } else if (target.blocking && target.blockEnergy <= 0) {
            target.blocking = false;
        }
        if (!target.blocking) target.energy = Math.min(target.maxEnergy, target.energy + 0.3);
    }

    // ============================================================
    // 关卡配置
    // ============================================================
    function getStageConfig(stage) {
        const isBoss = stage % 5 === 0;
        const baseHealth = 100 + (stage - 1) * 22;
        const baseAttack = 9 + (stage - 1) * 1.5;
        const baseSpeed = 2.0 + (stage - 1) * 0.09;
        let type = 'melee';
        if (stage >= 3 && stage % 3 === 0) type = 'ranged';
        if (stage >= 4 && stage % 4 === 0) type = 'flying';
        if (isBoss) type = 'summoner';
        if (isBoss) {
            return {
                health: Math.floor(baseHealth * 2.2),
                attack: Math.floor(baseAttack * 1.8),
                speed: Math.min(4.2, baseSpeed * 0.85),
                isBoss: true, tag: '👑 召唤师',
                width: 62, height: 88, type: 'summoner',
            };
        }
        const tags = { melee: '近战', ranged: '远程', flying: '飞行' };
        return {
            health: Math.floor(baseHealth),
            attack: Math.floor(baseAttack),
            speed: Math.min(3.8, baseSpeed),
            isBoss: false, tag: tags[type] || '普通',
            width: type === 'flying' ? 52 : 48,
            height: type === 'flying' ? 52 : 68,
            type: type,
        };
    }
    function applyStage(stage) {
        const cfg = getStageConfig(stage);
        const e = state.enemy;
        e.maxHealth = cfg.health; e.health = cfg.health;
        e.attackPower = cfg.attack; e.speed = cfg.speed;
        e.isBoss = cfg.isBoss; e.type = cfg.type;
        e.width = cfg.width; e.height = cfg.height;
        e.x = 620; e.y = cfg.type === 'flying' ? 280 : 350;
        e.facing = -1;
        e.attackCooldown = 40; e.attackTimer = 0; e.hurtFlash = 0;
        e.shootCooldown = 60; e.summonCooldown = 200; e.floatPhase = 0;
        state.minions = [];
        state.projectiles = [];
        stageNumEl.textContent = `第 ${stage} 关`;
        stageTagEl.textContent = cfg.tag;
        if (cfg.isBoss) {
            stageTagEl.style.color = '#ff5555';
            stageTagEl.style.textShadow = '0 0 10px #ff0000';
        } else {
            stageTagEl.style.color = '#c8b0ff';
            stageTagEl.style.textShadow = 'none';
        }
        Background.setStage(stage);
    }
    function nextStage() {
        state.stage += 1;
        state.stageTransition = 30;
        applyStage(state.stage);
        saveMidProgress();
        const p = state.player;
        p.x = 200; p.invincible = 60;
        p.combo = 0; p.comboTimer = 0;
        state.particles = []; state.effects = [];
        spawnEffect(400, 200, `第 ${state.stage} 关`, '#ffd966', 52, 70);
        if (state.enemy.isBoss) {
            spawnEffect(400, 260, '👑 召唤师 来袭 👑', '#ff5555', 38, 80);
            AudioSys.bossWarn();
            Vibration.heavy();
        }
        updateUI();
    }

    // ============================================================
    // UI 更新
    // ============================================================
    function updateUI() {
        const p = state.player;
        playerHealthFill.style.width = Math.max(0, (p.health / p.maxHealth) * 100) + '%';
        playerEnergyFill.style.width = Math.min(100, (p.energy / p.maxEnergy) * 100) + '%';
        if (state.mode === 'single') {
            const e = state.enemy;
            enemyHealthFill.style.width = Math.max(0, (e.health / e.maxHealth) * 100) + '%';
        } else {
            const p2 = state.player2;
            enemyHealthFill.style.width = Math.max(0, (p2.health / p2.maxHealth) * 100) + '%';
        }
    }
    function updateParticlesAndEffects() {
        for (let i = state.particles.length - 1; i >= 0; i--) {
            const pt = state.particles[i];
            pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08;
            pt.vx *= 0.99; pt.vy *= 0.99; pt.life -= 1;
            if (pt.life <= 0 || pt.y > logicalHeight + 50 || pt.x < -50 || pt.x > logicalWidth + 50) {
                state.particles.splice(i, 1);
            }
        }
        for (let i = state.effects.length - 1; i >= 0; i--) {
            const ef = state.effects[i];
            ef.x += (Math.random() - 0.5) * 1.5;
            ef.y += ef.vy; ef.vy *= 0.98; ef.life -= 1;
            if (ef.life <= 0) state.effects.splice(i, 1);
        }
        for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
            const ft = state.floatingTexts[i];
            ft.y += ft.vy; ft.vy *= 0.97; ft.life -= 1;
            if (ft.life <= 0) state.floatingTexts.splice(i, 1);
        }
    }

    // ============================================================
    // 渲染角色
    // ============================================================
      function drawFighter(f, mainColor, accentColor, facing, isAttacking, isSpecial, isInvincibleOrHurt, isBoss, type, blocking) {
    ctx.save();
    ctx.translate(f.x + f.width / 2, f.y + f.height / 2);
    if (facing < 0) ctx.scale(-1, 1);
    if (isInvincibleOrHurt && Math.floor(Date.now() / 100) % 2 === 0) ctx.globalAlpha = 0.4;

    const w = f.width, h = f.height;
    const t = Date.now() / 1000;

    // 待机浮动 + 移动步伐
    const isPlayer = type === 'player';
    const idleBob = isPlayer ? Math.sin(t * 3) * 1.5 : 0;
    const attackLunge = isAttacking ? 8 : 0;

    // 皮肤风格
    let skinStyle = 'swordsman';
    let weaponType = 'sword';
    if (isPlayer) {
        if (mainColor === '#e04040') { skinStyle = 'berserker'; weaponType = 'axe'; }
        else if (mainColor === '#40c060') { skinStyle = 'assassin'; weaponType = 'dagger'; }
        else if (mainColor === '#a060e0') { skinStyle = 'mage'; weaponType = 'staff'; }
    }

    // 敌人风格
    if (!isPlayer) {
        if (type === 'summoner') { skinStyle = 'boss'; weaponType = 'staff'; }
        else if (type === 'flying') { skinStyle = 'flying'; weaponType = 'claw'; }
        else if (type === 'ranged') { skinStyle = 'archer'; weaponType = 'bow'; }
        else { skinStyle = 'melee'; weaponType = 'sword'; }
    }

    // ============ 阴影 ============
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, h / 2 + 6, w * 0.6, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 身体整体偏移（呼吸 + 攻击前倾）
    ctx.translate(0, idleBob);
    if (isAttacking) ctx.translate(attackLunge * 0.5, 0);

    // ============ 光环（特殊技/Boss） ============
    if (isSpecial) {
        ctx.save();
        ctx.globalAlpha = 0.4 + Math.sin(t * 10) * 0.2;
        ctx.shadowBlur = 40;
        ctx.shadowColor = '#88ddff';
        ctx.strokeStyle = '#88ddff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, w * 0.95, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
    if (isBoss) {
        ctx.save();
        ctx.globalAlpha = 0.5 + Math.sin(t * 4) * 0.2;
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ffcc44';
        ctx.strokeStyle = '#ffcc44';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, w * 0.9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // ============ 颜色 ============
    const c = {
        main: mainColor,
        accent: accentColor,
        dark: shadeColor(mainColor, -40),
        light: shadeColor(mainColor, 40),
        outline: 'rgba(0,0,0,0.7)',
        skin: '#f4c8a0',       // 皮肤色
        skinDark: '#c89870',
        metal: '#c0c8d0',
        metalDark: '#808890',
        boot: '#1a1218',
        belt: '#4a3828',
    };

    // ============ 绘制腿部 ============
    const legSpread = (skinStyle === 'berserker' || skinStyle === 'boss') ? 1.3 : 1;
    const walkCycle = isPlayer ? Math.sin(t * 8) * 2 : 0;
    drawLeg(-w * 0.22, h * 0.05, c, legSpread, walkCycle, skinStyle);
    drawLeg(w * 0.22, h * 0.05, c, legSpread, -walkCycle, skinStyle);

    // ============ 绘制躯干 ============
    drawTorso(0, -h * 0.08, w, h, c, skinStyle, mainColor, accentColor);

    // ============ 绘制手臂 ============
    const armSwing = isAttacking ? -0.8 : (isPlayer ? Math.sin(t * 3) * 0.1 : 0);
    // 后手臂
    drawArm(-w * 0.05, -h * 0.12, c, -0.3, skinStyle, false);
    // 前手臂（攻击时挥动）
    drawArm(w * 0.05, -h * 0.12, c, armSwing, skinStyle, true);

    // ============ 绘制武器 ============
    if (weaponType === 'sword') drawSword(w, h, c, isAttacking, skinStyle);
    else if (weaponType === 'axe') drawAxe(w, h, c, isAttacking);
    else if (weaponType === 'dagger') drawDagger(w, h, c, isAttacking);
    else if (weaponType === 'staff') drawStaff(w, h, c, isAttacking, skinStyle);
    else if (weaponType === 'bow') drawBow(w, h, c, isAttacking);
    else if (weaponType === 'claw') drawClaw(w, h, c, isAttacking);

    // ============ 绘制头部 ============
    drawHead(0, -h * 0.38, c, skinStyle, isBoss, type);

    // ============ 格挡护盾 ============
    if (blocking) {
        ctx.save();
        ctx.globalAlpha = 0.6 + Math.sin(t * 10) * 0.2;
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#88ccff';
        ctx.strokeStyle = '#88ccff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, w * 1.0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(0, 0, w * 1.05, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // ============ 连击数 ============
    if (f.combo && f.combo >= 2) {
        ctx.save();
        ctx.font = 'bold 20px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffdd44';
        ctx.shadowColor = '#ff8800';
        ctx.shadowBlur = 15;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText(`${f.combo}连`, -15, -h/2 - 25);
        ctx.fillText(`${f.combo}连`, -15, -h/2 - 25);
        ctx.restore();
    }

    ctx.restore();
}

// ============================================================
// 辅助函数：颜色明暗调整
// ============================================================
function shadeColor(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return `rgb(${R},${G},${B})`;
}

// ============================================================
// 绘制腿部
// ============================================================
function drawLeg(x, y, c, spread, walkOffset, style) {
    ctx.save();
    ctx.translate(x * spread, y);

    // 大腿
    ctx.fillStyle = c.dark;
    ctx.beginPath();
    ctx.roundRect(-5, 0, 10, 14, 3);
    ctx.fill();

    // 小腿
    const kneeBend = walkOffset * 0.5;
    ctx.save();
    ctx.translate(0, 14 + kneeBend);
    ctx.fillStyle = c.main;
    ctx.beginPath();
    ctx.roundRect(-5, 0, 10, 14, 3);
    ctx.fill();

    // 靴子
    ctx.fillStyle = c.boot;
    ctx.beginPath();
    ctx.roundRect(-6, 12, 14, 8, 2);
    ctx.fill();
    ctx.fillStyle = shadeColor(c.boot, 20);
    ctx.beginPath();
    ctx.roundRect(-6, 12, 14, 3, 2);
    ctx.fill();
    ctx.restore();

    // 轮廓
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(-5, 0, 10, 14, 3);
    ctx.stroke();

    ctx.restore();
}

// ============================================================
// 绘制躯干
// ============================================================
function drawTorso(x, y, w, h, c, style, mainColor, accentColor) {
    ctx.save();
    ctx.translate(x, y);

    // 躯干主体（梯形）
    ctx.beginPath();
    const topW = w * 0.38;
    const botW = w * 0.42;
    const torsoH = h * 0.42;
    ctx.moveTo(-topW, -torsoH * 0.5);
    ctx.lineTo(topW, -torsoH * 0.5);
    ctx.lineTo(botW, torsoH * 0.5);
    ctx.lineTo(-botW, torsoH * 0.5);
    ctx.closePath();

    // 渐变填充
    const grad = ctx.createLinearGradient(-w * 0.4, -h * 0.3, w * 0.4, h * 0.3);
    grad.addColorStop(0, c.light);
    grad.addColorStop(0.5, c.main);
    grad.addColorStop(1, c.dark);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 胸甲/背心装饰
    if (style === 'berserker' || style === 'boss') {
        // 胸甲
        ctx.fillStyle = c.metalDark;
        ctx.beginPath();
        ctx.roundRect(-topW * 0.8, -torsoH * 0.4, topW * 1.6, torsoH * 0.5, 3);
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.stroke();
        // 高光
        ctx.fillStyle = c.metal;
        ctx.beginPath();
        ctx.roundRect(-topW * 0.6, -torsoH * 0.35, topW * 0.4, torsoH * 0.3, 2);
        ctx.fill();
    } else if (style === 'assassin') {
        // 刺客：斜挎带
        ctx.strokeStyle = c.belt;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-topW * 0.7, -torsoH * 0.4);
        ctx.lineTo(topW * 0.7, torsoH * 0.3);
        ctx.stroke();
        // 腰带
        ctx.fillStyle = c.belt;
        ctx.beginPath();
        ctx.roundRect(-botW * 0.95, torsoH * 0.3, botW * 1.9, 6, 2);
        ctx.fill();
    } else if (style === 'mage') {
        // 法师：长袍
        ctx.fillStyle = c.dark;
        ctx.beginPath();
        ctx.moveTo(-topW * 0.7, -torsoH * 0.4);
        ctx.lineTo(topW * 0.7, -torsoH * 0.4);
        ctx.lineTo(botW * 1.1, torsoH * 0.5);
        ctx.lineTo(-botW * 1.1, torsoH * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.stroke();
        // 腰带
        ctx.fillStyle = c.belt;
        ctx.beginPath();
        ctx.roundRect(-botW * 0.95, torsoH * 0.25, botW * 1.9, 5, 2);
        ctx.fill();
    } else {
        // 默认：腰带
        ctx.fillStyle = c.belt;
        ctx.beginPath();
        ctx.roundRect(-botW * 0.95, torsoH * 0.3, botW * 1.9, 5, 2);
        ctx.fill();
        // 腰带扣
        ctx.fillStyle = c.metal;
        ctx.beginPath();
        ctx.arc(0, torsoH * 0.3 + 2.5, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    // 肩甲（战士/狂战/Boss）
    if (style === 'berserker' || style === 'boss' || style === 'swordsman') {
        ctx.fillStyle = c.metal;
        ctx.beginPath();
        ctx.arc(-topW, -torsoH * 0.5, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(topW, -torsoH * 0.5, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // 高光
        ctx.fillStyle = c.light;
        ctx.beginPath();
        ctx.arc(-topW - 1, -torsoH * 0.5 - 1, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(topW - 1, -torsoH * 0.5 - 1, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

// ============================================================
// 绘制手臂
// ============================================================
function drawArm(x, y, c, swing, style, isFront) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(swing);

    // 上臂
    ctx.fillStyle = isFront ? c.main : c.dark;
    ctx.beginPath();
    ctx.roundRect(-4, 0, 8, 12, 3);
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1;
    ctx.stroke();

    // 前臂
    ctx.translate(0, 12);
    ctx.rotate(swing * 0.5);
    ctx.fillStyle = isFront ? c.light : c.main;
    ctx.beginPath();
    ctx.roundRect(-3.5, 0, 7, 11, 3);
    ctx.fill();
    ctx.stroke();

    // 手
    ctx.fillStyle = c.skin;
    ctx.beginPath();
    ctx.arc(0, 12, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

// ============================================================
// 绘制头部
// ============================================================
function drawHead(x, y, c, style, isBoss, type) {
    ctx.save();
    ctx.translate(x, y);

    const headR = isBoss ? 20 : 16;

    // 脖子
    ctx.fillStyle = c.skinDark;
    ctx.beginPath();
    ctx.roundRect(-4, headR * 0.6, 8, 6, 2);
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1;
    ctx.stroke();

    // 头（椭圆）
    ctx.beginPath();
    ctx.ellipse(0, 0, headR * 0.95, headR, 0, 0, Math.PI * 2);

    // 头部渐变
    const grad = ctx.createRadialGradient(-headR * 0.3, -headR * 0.3, 2, 0, 0, headR);
    grad.addColorStop(0, shadeColor(c.skin, 20));
    grad.addColorStop(1, c.skinDark);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 根据风格绘制头饰
    if (style === 'swordsman') {
        // 头盔
        ctx.fillStyle = c.metal;
        ctx.beginPath();
        ctx.arc(0, -2, headR * 0.95, Math.PI, 0);
        ctx.lineTo(headR * 0.9, 3);
        ctx.lineTo(-headR * 0.9, 3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.stroke();
        // 头盔高光
        ctx.fillStyle = c.light;
        ctx.beginPath();
        ctx.ellipse(-headR * 0.3, -headR * 0.5, headR * 0.25, headR * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        // 红缨
        ctx.fillStyle = '#cc3333';
        ctx.beginPath();
        ctx.moveTo(0, -headR);
        ctx.lineTo(-3, -headR - 8);
        ctx.lineTo(3, -headR - 8);
        ctx.closePath();
        ctx.fill();
    } else if (style === 'berserker') {
        // 角头盔
        ctx.fillStyle = c.metalDark;
        ctx.beginPath();
        ctx.arc(0, -2, headR * 0.95, Math.PI, 0);
        ctx.lineTo(headR * 0.9, 3);
        ctx.lineTo(-headR * 0.9, 3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.stroke();
        // 双角
        ctx.fillStyle = '#f0e8d0';
        ctx.beginPath();
        ctx.moveTo(-headR * 0.7, -headR * 0.5);
        ctx.lineTo(-headR * 1.2, -headR * 1.3);
        ctx.lineTo(-headR * 0.4, -headR * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(headR * 0.7, -headR * 0.5);
        ctx.lineTo(headR * 1.2, -headR * 1.3);
        ctx.lineTo(headR * 0.4, -headR * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } else if (style === 'assassin') {
        // 面罩
        ctx.fillStyle = c.dark;
        ctx.beginPath();
        ctx.roundRect(-headR * 0.95, -3, headR * 1.9, headR * 0.9, 3);
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.stroke();
        // 头巾
        ctx.fillStyle = c.main;
        ctx.beginPath();
        ctx.arc(0, -2, headR * 0.98, Math.PI, 0);
        ctx.lineTo(headR * 0.9, 2);
        ctx.lineTo(-headR * 0.9, 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 飘带
        ctx.strokeStyle = c.main;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-headR * 0.8, -2);
        ctx.quadraticCurveTo(-headR * 1.5, -5, -headR * 1.8, 3);
        ctx.stroke();
    } else if (style === 'mage') {
        // 尖帽
        ctx.fillStyle = c.main;
        ctx.beginPath();
        ctx.moveTo(-headR * 0.9, -2);
        ctx.lineTo(0, -headR * 2.2);
        ctx.lineTo(headR * 0.9, -2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // 帽檐
        ctx.fillStyle = c.dark;
        ctx.beginPath();
        ctx.ellipse(0, -2, headR * 1.1, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // 星星装饰
        ctx.fillStyle = '#ffee88';
        ctx.beginPath();
        ctx.arc(0, -headR * 1.2, 2, 0, Math.PI * 2);
        ctx.fill();
    } else if (style === 'boss') {
        // Boss王冠
        ctx.fillStyle = '#ffcc44';
        ctx.beginPath();
        ctx.moveTo(-headR * 0.9, -headR * 0.6);
        ctx.lineTo(-headR * 0.7, -headR * 1.4);
        ctx.lineTo(-headR * 0.35, -headR * 0.9);
        ctx.lineTo(0, -headR * 1.6);
        ctx.lineTo(headR * 0.35, -headR * 0.9);
        ctx.lineTo(headR * 0.7, -headR * 1.4);
        ctx.lineTo(headR * 0.9, -headR * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // 宝石
        ctx.fillStyle = '#ff2244';
        ctx.beginPath();
        ctx.arc(0, -headR * 1.1, 2.5, 0, Math.PI * 2);
        ctx.fill();
    } else if (style === 'flying') {
        // 飞行兵：兜帽
        ctx.fillStyle = c.main;
        ctx.beginPath();
        ctx.arc(0, -2, headR * 1.0, Math.PI, 0);
        ctx.lineTo(headR * 0.9, headR * 0.4);
        ctx.lineTo(-headR * 0.9, headR * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = c.outline;
        ctx.stroke();
        // 兜帽内的阴影
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(0, -2, headR * 0.7, headR * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // ============ 眼睛 ============
    // 左眼
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(headR * 0.35, -2, 3.5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // 右眼
    ctx.beginPath();
    ctx.ellipse(-headR * 0.35, -2, 3.5, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // 瞳孔（面向右）
    let pupilColor = '#1a3050';
    if (isBoss) pupilColor = '#ff2200';
    else if (style === 'flying') pupilColor = '#cc44ff';
    else if (style === 'assassin') pupilColor = '#00ff88';
    else if (style === 'mage') pupilColor = '#aa44ff';
    else if (style === 'berserker') pupilColor = '#ff6600';

    ctx.fillStyle = pupilColor;
    ctx.beginPath();
    ctx.arc(headR * 0.35 + 1, -2, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-headR * 0.35 + 1, -2, 2, 0, Math.PI * 2);
    ctx.fill();

    // 眼神光
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(headR * 0.35 + 2, -3, 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-headR * 0.35 + 2, -3, 0.8, 0, Math.PI * 2);
    ctx.fill();

    // 眉毛（严肃表情）
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(headR * 0.15, -7);
    ctx.lineTo(headR * 0.6, -6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-headR * 0.15, -7);
    ctx.lineTo(-headR * 0.6, -6);
    ctx.stroke();

    // 嘴
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    if (style === 'berserker' || isBoss) {
        // 咆哮
        ctx.moveTo(-3, 6);
        ctx.quadraticCurveTo(0, 9, 3, 6);
    } else {
        // 严肃
        ctx.moveTo(-3, 7);
        ctx.lineTo(3, 7);
    }
    ctx.stroke();

    ctx.restore();
}

// ============================================================
// 绘制武器：剑
// ============================================================
function drawSword(w, h, c, isAttacking, style) {
    ctx.save();
    // 武器位置：右手
    const handX = w * 0.35;
    const handY = -h * 0.1;

    ctx.translate(handX, handY);
    if (isAttacking) {
        ctx.rotate(-0.9);
    } else {
        ctx.rotate(-0.15);
    }

    // 剑柄
    ctx.fillStyle = '#5a3a20';
    ctx.beginPath();
    ctx.roundRect(-2, -8, 4, 10, 1);
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1;
    ctx.stroke();

    // 护手
    ctx.fillStyle = '#c8a850';
    ctx.beginPath();
    ctx.roundRect(-6, -9, 12, 3, 1);
    ctx.fill();
    ctx.stroke();

    // 剑身
    const bladeGrad = ctx.createLinearGradient(-3, -40, 3, -40);
    bladeGrad.addColorStop(0, '#e0e8f0');
    bladeGrad.addColorStop(0.5, '#ffffff');
    bladeGrad.addColorStop(1, '#a0a8b0');
    ctx.fillStyle = bladeGrad;
    ctx.beginPath();
    ctx.moveTo(-3, -40);
    ctx.lineTo(3, -40);
    ctx.lineTo(2, -8);
    ctx.lineTo(-2, -8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.stroke();

    // 剑刃中线
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -39);
    ctx.lineTo(0, -9);
    ctx.stroke();

    // 剑尖高光
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(0, -42);
    ctx.lineTo(2, -38);
    ctx.lineTo(-2, -38);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

// ============================================================
// 绘制武器：斧
// ============================================================
function drawAxe(w, h, c, isAttacking) {
    ctx.save();
    const handX = w * 0.35;
    const handY = -h * 0.1;
    ctx.translate(handX, handY);
    if (isAttacking) ctx.rotate(-1.2);
    else ctx.rotate(-0.2);

    // 柄
    ctx.fillStyle = '#5a3a20';
    ctx.beginPath();
    ctx.roundRect(-2, -35, 4, 35, 1);
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1;
    ctx.stroke();

    // 斧头
    ctx.fillStyle = '#c8c8d0';
    ctx.beginPath();
    ctx.moveTo(2, -35);
    ctx.lineTo(16, -38);
    ctx.quadraticCurveTo(20, -30, 16, -20);
    ctx.lineTo(2, -18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 斧刃高光
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(14, -35);
    ctx.quadraticCurveTo(17, -30, 14, -22);
    ctx.lineTo(10, -22);
    ctx.quadraticCurveTo(13, -30, 10, -35);
    ctx.closePath();
    ctx.fill();

    // 另一侧斧刃
    ctx.fillStyle = '#a8a8b0';
    ctx.beginPath();
    ctx.moveTo(-2, -35);
    ctx.lineTo(-12, -37);
    ctx.quadraticCurveTo(-15, -30, -12, -22);
    ctx.lineTo(-2, -20);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

// ============================================================
// 绘制武器：匕首
// ============================================================
function drawDagger(w, h, c, isAttacking) {
    ctx.save();
    const handX = w * 0.35;
    const handY = -h * 0.1;
    ctx.translate(handX, handY);
    if (isAttacking) ctx.rotate(-0.6);
    else ctx.rotate(-0.1);

    // 柄
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.roundRect(-1.5, -6, 3, 8, 1);
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1;
    ctx.stroke();

    // 护手
    ctx.fillStyle = '#c8a850';
    ctx.beginPath();
    ctx.roundRect(-4, -7, 8, 2, 1);
    ctx.fill();
    ctx.stroke();

    // 短刃
    ctx.fillStyle = '#e8f0ff';
    ctx.beginPath();
    ctx.moveTo(-2, -20);
    ctx.lineTo(2, -20);
    ctx.lineTo(1.5, -6);
    ctx.lineTo(-1.5, -6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 中线
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(0, -19);
    ctx.lineTo(0, -7);
    ctx.stroke();

    ctx.restore();

    // 左手第二把匕首
    ctx.save();
    const handX2 = -w * 0.25;
    const handY2 = -h * 0.05;
    ctx.translate(handX2, handY2);
    ctx.scale(-1, 1);
    if (isAttacking) ctx.rotate(-0.5);
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.roundRect(-1.5, -6, 3, 8, 1);
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#e8f0ff';
    ctx.beginPath();
    ctx.moveTo(-2, -20);
    ctx.lineTo(2, -20);
    ctx.lineTo(1.5, -6);
    ctx.lineTo(-1.5, -6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

// ============================================================
// 绘制武器：法杖
// ============================================================
function drawStaff(w, h, c, isAttacking, style) {
    ctx.save();
    const handX = w * 0.35;
    const handY = -h * 0.1;
    ctx.translate(handX, handY);
    if (isAttacking) ctx.rotate(-0.5);
    else ctx.rotate(-0.05);

    // 杖身
    const staffGrad = ctx.createLinearGradient(-2, 0, 2, 0);
    staffGrad.addColorStop(0, '#5a3a20');
    staffGrad.addColorStop(0.5, '#8a5a30');
    staffGrad.addColorStop(1, '#3a2010');
    ctx.fillStyle = staffGrad;
    ctx.beginPath();
    ctx.roundRect(-2, -40, 4, 45, 1);
    ctx.fill();
    ctx.strokeStyle = c.outline;
    ctx.lineWidth = 1;
    ctx.stroke();

    // 顶部宝石
    const orbColor = style === 'boss' ? '#ff44aa' : '#aa88ff';
    ctx.shadowColor = orbColor;
    ctx.shadowBlur = 15;
    ctx.fillStyle = orbColor;
    ctx.beginPath();
    ctx.arc(0, -42, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 宝石高光
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(-1.5, -43.5, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // 宝石光晕
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 200) * 0.2;
    ctx.fillStyle = orbColor;
    ctx.beginPath();
    ctx.arc(0, -42, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// ============================================================
// 绘制武器：弓
// ============================================================
function drawBow(w, h, c, isAttacking) {
    ctx.save();
    const handX = w * 0.4;
    const handY = -h * 0.08;
    ctx.translate(handX, handY);

    // 弓身
    ctx.strokeStyle = '#6a4a20';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 22, -Math.PI * 0.7, Math.PI * 0.7);
    ctx.stroke();

    // 弓弦
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const topY = Math.sin(-Math.PI * 0.7) * 22;
    const botY = Math.sin(Math.PI * 0.7) * 22;
    const topX = Math.cos(-Math.PI * 0.7) * 22;
    const botX = Math.cos(Math.PI * 0.7) * 22;
    ctx.moveTo(topX, topY);
    ctx.lineTo(botX, botY);
    ctx.stroke();

    // 弓上的光效
    ctx.shadowColor = c.accent;
    ctx.shadowBlur = 8;
    ctx.strokeStyle = c.accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 22, -Math.PI * 0.7, Math.PI * 0.7);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore();
}

// ============================================================
// 绘制武器：爪
// ============================================================
function drawClaw(w, h, c, isAttacking) {
    ctx.save();
    const handX = w * 0.35;
    const handY = -h * 0.1;
    ctx.translate(handX, handY);
    if (isAttacking) ctx.rotate(-0.5);

    // 3 根爪子
    for (let i = -1; i <= 1; i++) {
        ctx.strokeStyle = '#e0e0e8';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(i * 3, 0);
        ctx.quadraticCurveTo(i * 4, -8, i * 3, -14);
        ctx.stroke();

        // 爪子发光
        ctx.shadowColor = '#ff44aa';
        ctx.shadowBlur = 6;
        ctx.strokeStyle = '#ff88cc';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(i * 3, 0);
        ctx.quadraticCurveTo(i * 4, -8, i * 3, -14);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
    ctx.lineCap = 'butt';

    ctx.restore();
}

    function drawMinion(m) {
        ctx.save();
        ctx.translate(m.x + m.width/2, m.y + m.height/2);
        if (m.facing < 0) ctx.scale(-1, 1);
        if (m.hurtFlash > 0 && Math.floor(Date.now() / 80) % 2 === 0) ctx.globalAlpha = 0.5;
        const w = m.width, h = m.height;
        ctx.shadowColor = '#ff44aa'; ctx.shadowBlur = 15;
        ctx.fillStyle = '#5a2a4a';
        ctx.beginPath(); ctx.roundRect(-w/2 + 2, -h/2 + 4, w - 4, h - 14, 10); ctx.fill();
        ctx.fillStyle = '#ff80cc';
        ctx.beginPath(); ctx.arc(0, -h/2 + 4, 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(5, -h/2 + 2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff2200';
        ctx.beginPath(); ctx.arc(6, -h/2 + 1, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.shadowBlur = 0;
    }
    function drawShadow(cx, bottomY) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(cx, bottomY + 4, 26, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // ============================================================
    // 渲染
    // ============================================================
    function render() {
        Background.render(ctx, logicalWidth, logicalHeight, state.mode === 'single' && state.enemy.isBoss);
        const p = state.player, p2 = state.player2, e = state.enemy;
        const skin = SKINS[selectedSkin];
        drawShadow(p.x + p.width/2, p.y + p.height);
        if (state.mode === 'vs') drawShadow(p2.x + p2.width/2, p2.y + p2.height);
        if (state.mode === 'single' && e.health > 0) drawShadow(e.x + e.width/2, e.y + e.height);
        if (state.mode === 'single') {
            for (const m of state.minions) drawMinion(m);
            if (e.health > 0) {
                let mainC, accentC;
                if (e.type === 'ranged') { mainC = '#b06030'; accentC = '#ffcc80'; }
                else if (e.type === 'flying') { mainC = '#8040b0'; accentC = '#e0a0ff'; }
                else if (e.type === 'summoner') { mainC = '#8a1a5a'; accentC = '#ff80cc'; }
                else { mainC = '#b0304a'; accentC = '#ffa0b0'; }
                drawFighter(e, mainC, accentC, e.facing, e.attackTimer > 0, false, e.hurtFlash > 0, e.isBoss, e.type);
            }
            if (p.health > 0 || state.gameOver) {
                drawFighter(p, skin.main, skin.accent, p.facing, p.attackTimer > 0, p.specialTimer > 0, p.invincible > 0, false, 'player', p.blocking);
            }
        } else {
            if (p2.health > 0 || state.gameOver) {
                drawFighter(p2, '#40c060', '#b0ffb0', p2.facing, p2.attackTimer > 0, p2.specialTimer > 0, p2.invincible > 0, false, 'player', p2.blocking);
            }
            if (p.health > 0 || state.gameOver) {
                drawFighter(p, skin.main, skin.accent, p.facing, p.attackTimer > 0, p.specialTimer > 0, p.invincible > 0, false, 'player', p.blocking);
            }
        }
        for (const pr of state.projectiles) {
            ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.radius, 0, Math.PI * 2);
            ctx.fillStyle = pr.color; ctx.shadowColor = pr.color; ctx.shadowBlur = 20; ctx.fill();
            ctx.shadowBlur = 0;
        }
        for (const pt of state.particles) {
            ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
            ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * 0.8, 0, Math.PI * 2);
            ctx.fillStyle = pt.color; ctx.shadowColor = pt.color; ctx.shadowBlur = 18; ctx.fill();
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
        for (const ef of state.effects) {
            ctx.globalAlpha = Math.min(1, (ef.life / ef.maxLife) * 1.2);
            ctx.font = `bold ${ef.size}px "Segoe UI", system-ui, sans-serif`;
            ctx.fillStyle = ef.color; ctx.shadowColor = ef.color; ctx.shadowBlur = 20;
            ctx.fillText(ef.text, ef.x - ctx.measureText(ef.text).width/2, ef.y);
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1.0;
        for (const ft of state.floatingTexts) {
            ctx.globalAlpha = Math.min(1, ft.life / ft.maxLife);
            ctx.font = `bold ${ft.size}px "Segoe UI", sans-serif`;
            ctx.fillStyle = ft.color; ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
            ctx.fillText(ft.text, ft.x - ctx.measureText(ft.text).width/2, ft.y);
            ctx.shadowBlur = 0;
        }
        ctx.globalAlpha = 1.0;
        if (state.stageTransition > 0 && state.mode === 'single') {
            ctx.globalAlpha = state.stageTransition / 30;
            ctx.font = 'bold 60px "Segoe UI", sans-serif';
            ctx.fillStyle = '#ffd966'; ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 30;
            const txt = `第 ${state.stage} 关`;
            ctx.fillText(txt, 400 - ctx.measureText(txt).width/2, 250);
            ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
        }
        if (state.gameOver) {
            ctx.font = 'bold 42px "Segoe UI", sans-serif';
            ctx.fillStyle = state.mode === 'vs' ? '#ffd966' : '#c44';
            ctx.shadowColor = '#000'; ctx.shadowBlur = 20;
            let text = state.mode === 'single' ? '☠️ 败北 ☠️' : (state.victory ? '🏆 P1 获胜!' : '🏆 P2 获胜!');
            ctx.fillText(text, 400 - ctx.measureText(text).width/2, 140);
            ctx.shadowBlur = 0;
            if (state.mode === 'single') {
                ctx.font = 'bold 24px "Segoe UI", sans-serif';
                ctx.fillStyle = '#ffd966';
                const t2 = `最终关卡: 第 ${state.stage} 关`;
                ctx.fillText(t2, 400 - ctx.measureText(t2).width/2, 190);
                ctx.font = 'bold 18px "Segoe UI", sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('点击画面重新开始', 400 - ctx.measureText('点击画面重新开始').width/2, 230);
            } else {
                ctx.font = 'bold 20px "Segoe UI", sans-serif';
                ctx.fillStyle = '#aaa';
                const t2 = '点击画面重新开始';
                ctx.fillText(t2, 400 - ctx.measureText(t2).width/2, 190);
            }
        }
    }

    // ============================================================
    // 更新
    // ============================================================
    function update(dt) {
        Background.update(dt);
        if (state.stageTransition > 0) {
            state.stageTransition--;
            updateParticlesAndEffects();
            return;
        }
        if (state.gameOver) {
            updateParticlesAndEffects();
            return;
        }
        const p = state.player;
        updatePlayerState(p);
        if (p.dashTimer <= 0) {
            if (state.keys.left && !state.keys.right) { p.x -= p.speed; p.facing = -1; }
            else if (state.keys.right && !state.keys.left) { p.x += p.speed; p.facing = 1; }
        }
        p.x = Math.max(30, Math.min(logicalWidth - p.width - 30, p.x));
        if (state.mode === 'single') {
            updateEnemy();
            updateMinions();
            updateProjectiles();
            const e = state.enemy;
            if (e.health <= 0) {
                state.currentRunKills += 1;
                if (e.isBoss) state.currentRunBossKills += 1;
                for (let i = 0; i < 5; i++) {
                    spawnParticles(e.x + e.width/2, e.y + e.height/2, 35, `hsl(${i*70}, 100%, 70%)`, 12, 14, 80);
                }
                spawnEffect(e.x + e.width/2, e.y - 50, `🏆 第${state.stage}关 通过!`, '#ffd966', 42, 80);
                AudioSys.explosion();
                Vibration.success();
                setTimeout(() => AudioSys.levelUp(), 200);
                grantStageReward(state.stage);
                nextStage();
            } else if (p.health <= 0) {
                state.gameOver = true;
                state.victory = false;
                spawnEffect(p.x + p.width/2, p.y - 50, '💀 败北...', '#aa3333', 40, 80);
                spawnEffect(400, 200, `坚持到第 ${state.stage} 关`, '#ffaa00', 32, 100);
                AudioSys.gameOver();
                Vibration.fail();
                const isNewRecord = updateRecord(state.stage, state.currentRunKills, state.currentRunBossKills);
                if (isNewRecord) {
                    setTimeout(() => AudioSys.newRecord(), 600);
                    spawnEffect(400, 300, '✨ 新纪录! ✨', '#ffd966', 38, 100);
                }
            }
        } else {
            const p2 = state.player2;
            updatePlayerState(p2);
            if (p2.dashTimer <= 0) {
                if (state.keys2.left && !state.keys2.right) { p2.x -= p2.speed; p2.facing = -1; }
                else if (state.keys2.right && !state.keys2.left) { p2.x += p2.speed; p2.facing = 1; }
            }
            p2.x = Math.max(30, Math.min(logicalWidth - p2.width - 30, p2.x));
            if (p.health <= 0) {
                state.gameOver = true; state.victory = false;
                spawnEffect(400, 200, '🏆 玩家2 获胜!', '#88ff88', 44, 100);
                AudioSys.gameOver(); Vibration.success();
            } else if (p2.health <= 0) {
                state.gameOver = true; state.victory = true;
                spawnEffect(400, 200, '🏆 玩家1 获胜!', '#ffd966', 44, 100);
                AudioSys.levelUp(); Vibration.success();
            }
        }
        updateParticlesAndEffects();
        updateUI();
    }

    // ============================================================
    // 模式切换
    // ============================================================
    function setMode(mode) {
        state.mode = mode;
        if (mode === 'single') {
            modeSingle.classList.add('active');
            modeVs.classList.remove('active');
            singleControls.style.display = 'flex';
            vsControls.style.display = 'none';
            footerTip.textContent = '单人闯关 · 冲刺/格挡/连击 · 动态场景';
            p1Label.textContent = '👤 你';
            p2Label.textContent = '👹 敌';
            stageNumEl.style.display = 'block';
            stageTagEl.style.display = 'block';
        } else {
            modeSingle.classList.remove('active');
            modeVs.classList.add('active');
            singleControls.style.display = 'none';
            vsControls.style.display = 'flex';
            footerTip.textContent = '双人对战 · 左P2 / 右P1 · 含冲刺格挡';
            p1Label.textContent = '🔵 P1';
            p2Label.textContent = '🟢 P2';
            stageNumEl.style.display = 'none';
            stageTagEl.style.display = 'none';
        }
        resetGame();
    }

    // ============================================================
    // 重置
    // ============================================================
    function resetGame() {
        state.stage = 1;
        state.stageTransition = 0;
        state.buffs.attackBonus = 0;
        state.buffs.speedBonus = 0;
        state.currentRunKills = 0;
        state.currentRunBossKills = 0;
        state.runSaved = false;
        Object.assign(state.player, createPlayer(200, 1, true));
        updatePlayerStats();
        Object.assign(state.player2, createPlayer(600, -1, false));
        state.enemy = createEnemy();
        state.minions = [];
        state.projectiles = [];
        state.particles = [];
        state.effects = [];
        state.floatingTexts = [];
        state.gameOver = false;
        state.victory = false;
        state.keys.left = false; state.keys.right = false;
        state.keys2.left = false; state.keys2.right = false;
        Background.reset();
        if (state.mode === 'single') applyStage(1);
        updateBuffDisplay();
        updateUI();
    }

    // ============================================================
    // 事件绑定
    // ============================================================
    function bindControls() {
        function initAudioOnce() {
            AudioSys.init(); AudioSys.resume();
            if (AudioSys.isMusicPlaying()) AudioSys.startMusic();
        }
        function bindHold(btn, keyObj, key) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudioOnce(); keyObj[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keyObj[key] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); initAudioOnce(); keyObj[key] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keyObj[key] = false; });
            btn.addEventListener('mouseleave', () => { keyObj[key] = false; });
        }
        function bindTap(btn, fn) {
            btn.addEventListener('click', (e) => { e.preventDefault(); initAudioOnce(); fn(); });
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudioOnce(); fn(); });
        }

        bindHold(document.getElementById('leftBtn'), state.keys, 'left');
        bindHold(document.getElementById('rightBtn'), state.keys, 'right');
        bindTap(document.getElementById('attackBtn'), () => {
            if (!state.gameOver && state.stageTransition <= 0 && state.mode === 'single')
                playerAttack(state.player, state.enemy);
        });
        bindTap(document.getElementById('specialBtn'), () => {
            if (!state.gameOver && state.stageTransition <= 0 && state.mode === 'single')
                playerSpecial(state.player, state.enemy);
        });
        bindTap(document.getElementById('dashBtn'), () => {
            if (!state.gameOver && state.stageTransition <= 0 && state.mode === 'single')
                playerDash(state.player);
        });
        const blockBtn = document.getElementById('blockBtn');
        const blockDown = (e) => {
            e.preventDefault(); initAudioOnce();
            if (!state.gameOver && state.mode === 'single' && state.player.blockEnergy > 0) {
                state.player.blocking = true; AudioSys.block();
            }
        };
        const blockUp = (e) => { e.preventDefault(); state.player.blocking = false; };
        blockBtn.addEventListener('touchstart', blockDown);
        blockBtn.addEventListener('touchend', blockUp);
        blockBtn.addEventListener('mousedown', blockDown);
        blockBtn.addEventListener('mouseup', blockUp);
        blockBtn.addEventListener('mouseleave', blockUp);

        bindHold(document.getElementById('p1LeftBtn'), state.keys, 'left');
        bindHold(document.getElementById('p1RightBtn'), state.keys, 'right');
        bindTap(document.getElementById('p1AttackBtn'), () => {
            if (!state.gameOver && state.mode === 'vs') playerAttack(state.player, state.player2);
        });
        bindTap(document.getElementById('p1SpecialBtn'), () => {
            if (!state.gameOver && state.mode === 'vs') playerSpecial(state.player, state.player2);
        });
        bindTap(document.getElementById('p1DashBtn'), () => {
            if (!state.gameOver && state.mode === 'vs') playerDash(state.player);
        });
        const p1Block = document.getElementById('p1BlockBtn');
        p1Block.addEventListener('touchstart', (e) => { e.preventDefault(); if (!state.gameOver && state.mode === 'vs' && state.player.blockEnergy > 0) { state.player.blocking = true; AudioSys.block(); } });
        p1Block.addEventListener('touchend', (e) => { e.preventDefault(); state.player.blocking = false; });
        p1Block.addEventListener('mousedown', (e) => { e.preventDefault(); if (!state.gameOver && state.mode === 'vs' && state.player.blockEnergy > 0) { state.player.blocking = true; AudioSys.block(); } });
        p1Block.addEventListener('mouseup', (e) => { e.preventDefault(); state.player.blocking = false; });
        p1Block.addEventListener('mouseleave', () => { state.player.blocking = false; });

        bindHold(document.getElementById('p2LeftBtn'), state.keys2, 'left');
        bindHold(document.getElementById('p2RightBtn'), state.keys2, 'right');
        bindTap(document.getElementById('p2AttackBtn'), () => {
            if (!state.gameOver && state.mode === 'vs') playerAttack(state.player2, state.player);
        });
        bindTap(document.getElementById('p2SpecialBtn'), () => {
            if (!state.gameOver && state.mode === 'vs') playerSpecial(state.player2, state.player);
        });
        bindTap(document.getElementById('p2DashBtn'), () => {
            if (!state.gameOver && state.mode === 'vs') playerDash(state.player2);
        });
        const p2Block = document.getElementById('p2BlockBtn');
        p2Block.addEventListener('touchstart', (e) => { e.preventDefault(); if (!state.gameOver && state.mode === 'vs' && state.player2.blockEnergy > 0) { state.player2.blocking = true; AudioSys.block(); } });
        p2Block.addEventListener('touchend', (e) => { e.preventDefault(); state.player2.blocking = false; });
        p2Block.addEventListener('mousedown', (e) => { e.preventDefault(); if (!state.gameOver && state.mode === 'vs' && state.player2.blockEnergy > 0) { state.player2.blocking = true; AudioSys.block(); } });
        p2Block.addEventListener('mouseup', (e) => { e.preventDefault(); state.player2.blocking = false; });
        p2Block.addEventListener('mouseleave', () => { state.player2.blocking = false; });

        muteBtn.addEventListener('click', (e) => {
            e.preventDefault(); initAudioOnce();
            const m = AudioSys.toggleMute();
            muteBtn.textContent = m ? '🔇' : '🔊';
        });
        musicBtn.addEventListener('click', (e) => {
            e.preventDefault(); initAudioOnce();
            const m = AudioSys.toggleMusic();
            musicBtn.textContent = m ? '🎵' : '🎵̶';
        });
        vibrateBtn.addEventListener('click', (e) => {
            e.preventDefault(); initAudioOnce();
            const v = Vibration.toggle();
            vibrateBtn.textContent = v ? '📳' : '📴';
        });

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); initAudioOnce(); });
        canvas.addEventListener('touchmove', (e) => e.preventDefault());
        canvas.addEventListener('click', () => {
            initAudioOnce();
            if (state.gameOver) resetGame();
        });

        window.addEventListener('keydown', (e) => {
            initAudioOnce();
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); state.keys.left = true; }
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); state.keys.right = true; }
            else if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); if (!state.gameOver && state.mode === 'single') playerAttack(state.player, state.enemy); }
            else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); if (!state.gameOver && state.mode === 'single') playerSpecial(state.player, state.enemy); }
            else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); if (!state.gameOver && state.mode === 'single') playerDash(state.player); }
            else if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); if (!state.gameOver && state.mode === 'single' && state.player.blockEnergy > 0) { state.player.blocking = true; AudioSys.block(); } }
            else if (e.key === 'j' || e.key === 'J') { e.preventDefault(); state.keys2.left = true; }
            else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); state.keys2.right = true; }
            else if (e.key === 'i' || e.key === 'I') { e.preventDefault(); if (!state.gameOver && state.mode === 'vs') playerAttack(state.player2, state.player); }
            else if (e.key === 'o' || e.key === 'O') { e.preventDefault(); if (!state.gameOver && state.mode === 'vs') playerSpecial(state.player2, state.player); }
            else if (e.key === 'm' || e.key === 'M') { const m = AudioSys.toggleMute(); muteBtn.textContent = m ? '🔇' : '🔊'; }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = false;
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = false;
            else if (e.key === 'j' || e.key === 'J') state.keys2.left = false;
            else if (e.key === 'l' || e.key === 'L') state.keys2.right = false;
            else if (e.key === 'q' || e.key === 'Q') state.player.blocking = false;
        });

        modeSingle.addEventListener('click', () => setMode('single'));
        modeVs.addEventListener('click', () => setMode('vs'));
        menuModeSingle.addEventListener('click', () => {
            menuModeSingle.classList.add('active');
            menuModeVs.classList.remove('active');
            setMode('single');
        });
        menuModeVs.addEventListener('click', () => {
            menuModeVs.classList.remove('active');
            menuModeSingle.classList.add('active');
            setMode('vs');
        });

        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectSkin(btn.dataset.skin);
                const p = state.player;
                spawnParticles(p.x + p.width/2, p.y + p.height/2, 25, SKINS[selectedSkin].accent, 8, 10, 50);
            });
        });
        document.querySelectorAll('.menu-skin-btn').forEach(btn => {
            btn.addEventListener('click', () => { selectSkin(btn.dataset.skin); });
        });

        menuStartBtn.addEventListener('click', () => {
            AudioSys.init(); AudioSys.resume();
            if (AudioSys.isMusicPlaying()) AudioSys.startMusic();
            menuOverlay.classList.add('hide');
            resetGame();
            state.currentRunKills = 0;
            state.currentRunBossKills = 0;
            state.runSaved = false;
        });
        menuHelpBtn.addEventListener('click', () => { HelpSystem.open(0); });
        menuClearBtn.addEventListener('click', () => {
            if (confirm('确定要清除所有存档吗？此操作不可撤销。')) {
                SaveSystem.clear();
                saveData = SaveSystem.defaultData();
                selectedSkin = 'blue';
                selectSkin('blue');
                refreshSaveUI();
                resetGame();
            }
        });
    }

    // ============================================================
    // 游戏循环
    // ============================================================
    let lastTime = 0;
    function gameLoop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // 初始化
    // ============================================================
    function init() {
        bindControls();
        HelpSystem.bindEvents();
        resetGame();
        selectSkin(selectedSkin);

        if (saveData.lastMode === 'vs') {
            menuModeVs.classList.add('active');
            menuModeSingle.classList.remove('active');
            setMode('vs');
        } else {
            setMode('single');
        }

        refreshSaveUI();
        menuOverlay.classList.add('hide');

        const splash = document.getElementById('splashScreen');
        setTimeout(() => {
            splash.classList.add('fade-out');
            setTimeout(() => {
                splash.classList.add('hide');

                if (HelpSystem.shouldAutoShow()) {
                    HelpSystem.open(0);
                    document.getElementById('helpNoShowCheck').checked = false;
                } else {
                    menuOverlay.classList.remove('hide');
                }

                const checkAndShowMenu = () => {
                    if (!document.getElementById('helpOverlay').classList.contains('show')) {
                        menuOverlay.classList.remove('hide');
                    }
                };
                const helpOverlay = document.getElementById('helpOverlay');
                const observer = new MutationObserver(checkAndShowMenu);
                observer.observe(helpOverlay, { attributes: true, attributeFilter: ['class'] });

            }, 800);
        }, 4200);

        requestAnimationFrame(gameLoop);
    }

    init();
})();
</script>
</body>
</html>
